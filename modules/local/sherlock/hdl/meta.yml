# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "sherlock_hdl"
description: Genetic correlation (rg) and SNP heritability between two traits with High-Definition Likelihood (HDL)
keywords:
  - gwas
  - hdl
  - genetic correlation
  - heritability
tools:
  - "HDL":
      description: "R package for genetic correlation and heritability using a full likelihood on LD eigen-decomposed reference panels"
      homepage: "https://github.com/zhenin/HDL"
      licence: ["GPL-3.0-or-later"]
      identifier: ""

input:
  - - meta1:
        type: map
        description: Trait 1 info from the samplesheet (first by trait name), e.g. [ id:'AD', trait_type:'cc', ... ]
    - sumstats1:
        type: file
        description: Trait 1 QC'd sumstats from SHERLOCK_QC (SNP CHR BP A1 A2 BETA SE P N ...); Z = BETA/SE is computed in the script
        pattern: "*.qc.tsv.gz"
    - meta2:
        type: map
        description: Trait 2 info from the samplesheet
    - sumstats2:
        type: file
        description: Trait 2 QC'd sumstats from SHERLOCK_QC
        pattern: "*.qc.tsv.gz"
  - hdl_ref:
      type: directory
      description: HDL reference panel folder (e.g. UKB_imputed_SVD_eigen99_extraction/), passed as --ref

output:
  results:
    - - meta1:
          type: map
          description: Trait 1 info from the samplesheet
      - meta2:
          type: map
          description: Trait 2 info from the samplesheet
      - "*.hdl.tsv":
          type: file
          description: One-row table (h2_1/2 + se, gcov + se, rg, rg_se, rg_z, rg_p, eigen_use)
          pattern: "*.hdl.tsv"
  log:
    - - meta1:
          type: map
          description: Trait 1 info from the samplesheet
      - meta2:
          type: map
          description: Trait 2 info from the samplesheet
      - "*_hdl.log":
          type: file
          description: HDL log
          pattern: "*_hdl.log"

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - HDL:
          type: string
          description: The tool name
      - "Rscript -e 'cat(as.character(packageVersion(\"HDL\")))'":
          type: eval
          description: The command used to get the version

authors:
  - "@guillermocomesanacimadevila"
maintainers:
  - "@guillermocomesanacimadevila"
