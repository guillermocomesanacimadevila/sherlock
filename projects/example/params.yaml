# Example settings for nf-core/sherlock
# Run from the repo root:
# nextflow run . -profile docker \
#     --input projects/example/gwas_pair.csv \
#     --outdir projects/example/results \
#     -params-file projects/example/params.yaml
# Copy this folder (e.g. to projects/my_run/) and replace the /path/to/ values with your own files.

# inputs / outputs
input: projects/example/gwas_pair.csv
outdir: projects/example/results

# steps to run (QC always runs)
steps: qc,rg,lrg

# ---- qc ----
target_build: GRCh38                            # build every GWAS is lifted to (GRCh37 or GRCh38)
qc_maf_thresh: 0.01                             # drop SNPs with minor allele frequency below this
qc_info_thresh: 0.8                             # drop SNPs with INFO below this (only used if info_col is set)
qc_drop_indels: true                            # drop indels / non-ACGT alleles
qc_drop_palindromes: true                       # drop A/T and C/G SNPs (strand can't be checked)
qc_drop_multiallelic: true                      # drop variants sharing a position
qc_drop_non_autosomal: true                     # keep chr 1-22 only
qc_drop_mhc: true                               # remove the MHC region (chr6, ~25-34 Mb)
qc_drop_apoe: false                             # remove the APOE region (chr19, ~1 Mb either side of APOE)

# ---- rg ----
rg_methods: ldsc,hdl                            # rg methods to run; use "ldsc" to skip HDL (no HDL panel needed)
rg_hdl_nref: 335265                             # sample size of the HDL panel (335265 for all UKB panels)

# ---- lrg ----
lrg_methods: hdll,lava                          # local rg methods to run; use "hdll" to skip LAVA (no LAVA reference needed)
# lrg_hdll_n0: 0                                # samples shared by the two GWAS (leave out = 0, no overlap)
# lrg_lava_univ_thresh: 0.05                    # local h2 p threshold for the LAVA rg test (leave out = 0.05)

# references
ancestry: EUR                                   # population of both GWAS; ref_panel must match
ref_panel: /path/to/1000G.EUR.QC.ALL            # PLINK prefix (.bed/.bim/.fam)
chain_file: /path/to/hg19ToHg38.over.chain      # needed because SCZ is GRCh37 and target_build is GRCh38
hm3: /path/to/w_hm3.snplist                     # HapMap3 SNP list for LDSC munge (rg step)
ldsc_ref: /path/to/eur_w_ld_chr                 # LDSC LD score folder (rg step)
hdl_ref: /path/to/UKB_imputed_SVD_eigen99_extraction   # HDL panel folder (rg step, EUR only), from github.com/zhenin/HDL/wiki/Reference-panels
hdll_ref: /path/to/hdll_ref                    # HDL-L folder with LD.path/ and bim.path/ (lrg step, EUR only), from doi.org/10.5281/zenodo.11001214
lava_ref: /path/to/lava_ref                    # LAVA folder with lava-ukb-v1.1_chr*.bcor/.info (lrg step, EUR, GRCh37), from github.com/josefin-werme/LAVA/blob/main/REFERENCE.md
lava_loci: /path/to/blocks_s2500_m25_f1_w200.GRCh37_hg19.locfile   # LAVA locus file (same build as lava_ref), from the LAVA repo support_data/
