[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sherlock-tools"
version = "0.1.2"
description = "QC, liftover and harmonisation of GWAS summary statistics for the nf-core/sherlock pipeline"
readme = "README.md"
license = "MIT"
authors = [{ name = "Guillermo Comesaña Cimadevila", email = "ComesanaCimadevilaG@cardiff.ac.uk" }]
requires-python = ">=3.12"
keywords = ["gwas", "summary statistics", "quality control", "liftover", "genetics", "nextflow", "nf-core", "polars"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "polars>=1.0",
    "liftover>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
dev = [
    "sherlock-tools[test]",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/guillermocomesanacimadevila/sherlock"
Source = "https://github.com/guillermocomesanacimadevila/sherlock/tree/dev/sherlock-tools"
Issues = "https://github.com/guillermocomesanacimadevila/sherlock/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
